<!-- Declaração do padrão HTML5 -->
<!DOCTYPE html>

<!-- Idioma principal do documento: Português do Brasil -->
<html lang="pt-br">

<!-- Cabeçalho: Metadados, título e recursos externos -->
<head>
    <!-- Codificação de caracteres UTF-8 -->
    <meta charset="UTF-8">

    <!-- Configuração de viewport para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da página exibido na aba do navegador -->
    <title>Tarefas App</title>

    <!-- Estilos CSS do Bootstrap (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Fim do cabeçalho -->
</head>

<!-- Corpo do documento: Conteúdo visível da aplicação -->
<body>

    <!-- Contêiner centralizado para o indicador de carregamento -->
    <div class="d-flex justify-content-center">
        <!-- Spinner de carregamento (exibido/ocultado via JS pelo ID "loading") -->
        <div class="spinner-border" role="status" id="loading">
        </div>
    </div>

    <!-- Título principal da página -->
    <p class="h1 text-center">Tarefas de um usuário</p>

    <!-- Tabela estilizada para renderização das tarefas via JS (ID "tasks") -->
    <table class="table table-hover" id="tasks">
    </table>

    <!-- Scripts: JS do Bootstrap (componentes interativos) e script da aplicação -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
<!-- Fim do corpo do documento -->
</body>

<!-- Fim do documento HTML -->
</html>
